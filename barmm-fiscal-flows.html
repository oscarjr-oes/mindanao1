or: #9A8A6E; font-weight: 500;\">Figure<\u002Fsc-raw-th>\n                        <sc-raw-th style=\"text-align: right; padding: 7px 8px; border-bottom: 1.5px solid #C9B889; font-family: Karla; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: #9A8A6E; font-weight: 500;\">Value<\u002Fsc-raw-th>\n                        <sc-raw-th style=\"text-align: left; padding: 7px 8px; border-bottom: 1.5px solid #C9B889; font-family: Karla; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: #9A8A6E; font-weight: 500;\">Status<\u002Fsc-raw-th>\n                        <sc-raw-th style=\"text-align: left; padding: 7px 8px; border-bottom: 1.5px solid #C9B889; font-family: Karla; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: #9A8A6E; font-weight: 500;\">Source<\u002Fsc-raw-th>\n                        <sc-raw-th style=\"text-align: left; padding: 7px 8px; border-bottom: 1.5px solid #C9B889; font-family: Karla; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: #9A8A6E; font-weight: 500;\">Page<\u002Fsc-raw-th>\n                        <sc-raw-th style=\"text-align: left; padding: 7px 8px; border-bottom: 1.5px solid #C9B889; font-family: Karla; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: #9A8A6E; font-weight: 500;\">Note<\u002Fsc-raw-th>\n                      <\u002Fsc-raw-tr>\n                    <\u002Fsc-raw-thead>\n                    <sc-raw-tbody>\n                      <sc-for list=\"{{ v8Figs }}\" as=\"f\" hint-placeholder-count=\"23\">\n                        <sc-raw-tr>\n                          <sc-raw-td style=\"padding: 6px 8px; border-bottom: 1px solid #E4D8BF;\">{{ f.fig }}<\u002Fsc-raw-td>\n                          <sc-raw-td style=\"padding: 6px 8px; border-bottom: 1px solid #E4D8BF; text-align: right; font-variant-numeric: tabular-nums;\">{{ f.val }}<\u002Fsc-raw-td>\n                          <sc-raw-td style=\"padding: 6px 8px; border-bottom: 1px solid #E4D8BF;\">\n                            <sc-if value=\"{{ f.isM }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"color: #4A5D3A; font-weight: 700;\">measured<\u002Fspan><\u002Fsc-if>\n                            <sc-if value=\"{{ f.isD }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"color: #5C4632; font-weight: 700;\">derived<\u002Fspan><\u002Fsc-if>\n                            <sc-if value=\"{{ f.isC }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"color: #9A8A6E; font-weight: 700;\">context<\u002Fspan><\u002Fsc-if>\n                          <\u002Fsc-raw-td>\n                          <sc-raw-td style=\"padding: 6px 8px; border-bottom: 1px solid #E4D8BF; font-size: 11.5px;\">{{ f.doc }}<\u002Fsc-raw-td>\n                          <sc-raw-td style=\"padding: 6px 8px; border-bottom: 1px solid #E4D8BF;\">{{ f.page }}<\u002Fsc-raw-td>\n                          <sc-raw-td style=\"padding: 6px 8px; border-bottom: 1px solid #E4D8BF; font-size: 11.5px; color: #9A8A6E;\">{{ f.note }}<\u002Fsc-raw-td>\n                        <\u002Fsc-raw-tr>\n                      <\u002Fsc-for>\n                    <\u002Fsc-raw-tbody>\n                  <\u002Fsc-raw-table>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdetails>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div data-panel=\"1\" data-screen-label=\"V10 procurement\" style=\"background: #FBF6EA; border: 1px solid #E4D8BF; border-radius: 10px; padding: 28px 30px; margin-top: 22px; box-shadow: 0 1px 3px rgba(46,36,24,.05);\">\n          <div style=\"display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; flex-wrap: wrap;\">\n            <div style=\"max-width: 66ch;\">\n              <h3 style=\"font-family: 'Marcellus', Georgia, serif; font-size: 21px; color: #2E2418; margin: 0; font-weight: 400;\">Procurement, as far as public data goes<\u002Fh3>\n              <p style=\"font-size: 15px; line-height: 1.7; color: #6E6047; margin: 10px 0 0; font-weight: 300;\">Supplier registration counts for BARMM, retrieved from PhilGEPS open data. This is a registration summary, not the supplier dot map and Lorenz curve the spec asks for — and the reason is on the panel.<\u002Fp>\n            <\u002Fdiv>\n            <x-import component-from-global-scope=\"MindanaoDesignSystem_94fd56.Badge\" tone=\"danger\" hint-size=\"auto,22px\">Measured, partial · counts marked ≈<\u002Fx-import>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1px; background: #E4D8BF; border: 1px solid #E4D8BF; border-radius: 8px; overflow: hidden; margin: 20px 0 0;\">\n            <div style=\"background: #F7F1E4; padding: 14px 16px;\">\n              <div style=\"font-family: 'Karla'; font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: #9A8A6E; font-weight: 500;\">Registered merchants<\u002Fdiv>\n              <div style=\"font-family: 'Marcellus', Georgia, serif; font-size: 21px; color: #2E2418; margin-top: 6px;\">≈ 3,000<\u002Fdiv>\n              <div style=\"font-size: 11.5px; color: #6E6047; margin-top: 2px;\">Region = BARMM<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background: #F7F1E4; padding: 14px 16px;\">\n              <div style=\"font-family: 'Karla'; font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: #9A8A6E; font-weight: 500;\">Platinum members<\u002Fdiv>\n              <div style=\"font-family: 'Marcellus', Georgia, serif; font-size: 21px; color: #2E2418; margin-top: 6px;\">534<\u002Fdiv>\n              <div style=\"font-size: 11.5px; color: #6E6047; margin-top: 2px;\">Fully compliant registration<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background: #F7F1E4; padding: 14px 16px;\">\n              <div style=\"font-family: 'Karla'; font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: #9A8A6E; font-weight: 500;\">Red members (flagged)<\u002Fdiv>\n              <div style=\"font-family: 'Marcellus', Georgia, serif; font-size: 21px; color: #A85C32; margin-top: 6px;\">≈ 2,000<\u002Fdiv>\n              <div style=\"font-size: 11.5px; color: #6E6047; margin-top: 2px;\">Incomplete registration<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background: #F7F1E4; padding: 14px 16px;\">\n              <div style=\"font-family: 'Karla'; font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: #9A8A6E; font-weight: 500;\">Suspended Platinum<\u002Fdiv>\n              <div style=\"font-family: 'Marcellus', Georgia, serif; font-size: 21px; color: #2E2418; margin-top: 6px;\">71<\u002Fdiv>\n              <div style=\"font-size: 11.5px; color: #6E6047; margin-top: 2px;\">As of 10 Aug 2026<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size: 14px; line-height: 1.7; color: #3A2E1E; background: #F0E6CF; border-radius: 6px; padding: 14px 16px; margin-top: 18px; max-width: 88ch;\">Only one value-denominated figure could be confirmed as correctly filtered to BARMM: <strong>30 civil-works award notices worth ₱754.58M<\u002Fstrong> under negotiated-procurement modes, FY2023. That is one classification in one year, not an annual total, and it cannot be broken out by supplier or address.<\u002Fdiv>\n          <sc-if value=\"{{ showDetail }}\" hint-placeholder-val=\"{{ true }}\">\n            <details style=\"margin-top: 12px;\">\n              <summary style=\"cursor: pointer; font-family: 'Karla'; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #A85C32; font-weight: 500; padding: 8px 0;\">Why C1 is not computable, and everything that was checked ▾<\u002Fsummary>\n              <div style=\"font-size: 13.5px; line-height: 1.7; color: #6E6047; max-width: 84ch;\">\n                <p style=\"margin: 0 0 10px;\">The spec defines C1 as the share of contract <em>value<\u002Fem> going to BARMM-registered suppliers. Public data gives merchant counts with no linkage to award values or addresses, so a value-weighted share — and the concentration measures V10 calls for — cannot be derived without fabricating a distribution. None are shown, and registered address is not economic substance in any case.<\u002Fp>\n                <p style=\"margin: 0;\">Checked and rejected: MFBM's Summary of Awarded Contracts page (2022 and 2023 tabs, no files posted); PhilGEPS's public award-notice search (capped to a rolling 90-day window, no client-agency filter); PhilGEPS Open Data Power BI dashboards (pre-aggregated only, and several visuals do not respect the Region filter); MFBM's Procurement Monitoring Report as of 31 Dec 2025 (project costs and dates, no supplier column); the modernized-PhilGEPS bidding specification (a future capability, not a dataset); and a GPPB-TSO freedom-of-information response confirming the data is not held there.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdetails>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div id=\"economy\" style=\"padding-top: 56px;\">\n        <div style=\"display: flex; align-items: baseline; gap: 16px; padding-bottom: 6px; border-bottom: 1px solid #D9CDB6;\">\n          <span style=\"font-family: 'Marcellus', Georgia, serif; font-size: 15px; color: #9A8A6E;\">05<\u002Fspan>\n          <h2 style=\"font-family: 'Marcellus', Georgia, serif; font-size: 30px; color: #2E2418; margin: 0; font-weight: 400;\">The economy<\u002Fh2>\n          <span style=\"font-size: 13.5px; color: #6E6047; margin-left: auto;\">What the spending is measured against<\u002Fspan>\n        <\u002Fdiv>\n\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 22px; margin-top: 24px;\">\n          <div data-panel=\"1\" data-screen-label=\"V6 GRDP\" style=\"background: #FBF6EA; border: 1px solid #E4D8BF; border-radius: 10px; padding: 28px 30px; box-shadow: 0 1px 3px rgba(46,36,24,.05);\">\n            <div style=\"display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap;\">\n              <h3 style=\"font-family: 'Marcellus', Georgia, serif; font-size: 21px; color: #2E2418; margin: 0; font-weight: 400;\">Regional output, 2020–2026<\u002Fh3>\n              <x-import component-from-global-scope=\"MindanaoDesignSystem_94fd56.Button\" variant=\"secondary\" size=\"sm\" sc-camel-on-click=\"{{ dl.v6 }}\" hint-size=\"auto,34px\">CSV<\u002Fx-import>\n            <\u002Fdiv>\n            <p style=\"font-size: 13.5px; line-height: 1.6; color: #6E6047; margin: 8px 0 0;\">PSA official GRDP, constant 2018 prices, including Sulu throughout. Solid is actual, dashed is forecast; the band is ±3% and illustrative only, not a published confidence interval.<\u002Fp>\n            <svg sc-camel-view-box=\"{{ grdpVB }}\" style=\"width: 100%; height: auto; display: block; margin-top: 14px; overflow: visible;\">\n              {{ grdpEl }}\n            <\u002Fsvg>\n            <div style=\"font-size: 12px; color: #9A8A6E; line-height: 1.55; margin-top: 8px;\">The series starts in 2020: 2018–2019 BARMM-aggregate GRDP is not yet in the dataset, shown as a gap rather than estimated. The September 2024 marker records the territorial ruling only — this series stays on the published including-Sulu basis and is not comparable to the five-province cuts beside it.<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div data-panel=\"1\" data-screen-label=\"V2 province map\" style=\"background: #FBF6EA; border: 1px solid #E4D8BF; border-radius: 10px; padding: 28px 30px; box-shadow: 0 1px 3px rgba(46,36,24,.05);\">\n            <div style=\"display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap;\">\n              <h3 style=\"font-family: 'Marcellus', Georgia, serif; font-size: 21px; color: #2E2418; margin: 0; font-weight: 400;\">By province<\u002Fh3>\n              <x-import component-from-global-scope=\"MindanaoDesignSystem_94fd56.Button\" variant=\"secondary\" size=\"sm\" sc-camel-on-click=\"{{ dl.v2 }}\" hint-size=\"auto,34px\">CSV<\u002Fx-import>\n            <\u002Fdiv>\n            <div style=\"margin-top: 12px; max-width: 300px;\">\n              <x-import component-from-global-scope=\"MindanaoDesignSystem_94fd56.Select\" label=\"Metric\" options=\"{{ metricOptions }}\" value=\"{{ metricLabel }}\" sc-camel-on-change=\"{{ onMetric }}\" hint-size=\"100%,64px\"><\u002Fx-import>\n            <\u002Fdiv>\n            <svg sc-camel-view-box=\"0 0 380 300\" style=\"width: 100%; height: auto; display: block; margin-top: 12px;\">\n              {{ mapEl }}\n            <\u002Fsvg>\n            <div style=\"display: flex; gap: 8px; align-items: center; font-size: 12px; color: #6E6047; margin-top: 6px;\">\n              <sc-for list=\"{{ mapLegend }}\" as=\"l\" hint-placeholder-count=\"2\">\n                <span style=\"display: flex; gap: 5px; align-items: center;\">\n                  <span style=\"{{ l.style }}\"><\u002Fspan>\n                  <span>{{ l.label }}<\u002Fspan>\n                <\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"font-size: 12px; color: #9A8A6E; line-height: 1.55; margin-top: 8px;\">Layout is schematic and not to scale — no verified boundary file exists yet. Sulu is drawn hatched because it is administratively excluded from every provincial series after 9 September 2024: shown as excluded, not silently omitted. Per-capita metrics are absent because no provincial population figures exist in the dataset.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div data-panel=\"1\" data-screen-label=\"V7 sector mix\" style=\"background: #FBF6EA; border: 1px solid #E4D8BF; border-radius: 10px; padding: 28px 30px; margin-top: 22px; box-shadow: 0 1px 3px rgba(46,36,24,.05);\">\n          <div style=\"display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; flex-wrap: wrap;\">\n            <div style=\"max-width: 64ch;\">\n              <h3 style=\"font-family: 'Marcellus', Georgia, serif; font-size: 21px; color: #2E2418; margin: 0; font-weight: 400;\">Sector composition, 2024<\u002Fh3>\n              <p style=\"font-size: 13.5px; line-height: 1.6; color: #6E6047; margin: 8px 0 0;\">Agriculture, industry and services as shares of each province's output. Shares use each province's own measured components as denominator and sum to 100%.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"display: flex; gap: 10px; align-items: center;\">\n              <x-import component-from-global-scope=\"MindanaoDesignSystem_94fd56.Badge\" tone=\"success\" hint-size=\"auto,22px\">Measured GVA<\u002Fx-import>\n              <x-import component-from-global-scope=\"MindanaoDesignSystem_94fd56.Button\" variant=\"secondary\" size=\"sm\" sc-camel-on-click=\"{{ dl.v7 }}\" hint-size=\"auto,34px\">CSV<\u002Fx-import>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; margin-top: 20px;\">\n            <sc-for list=\"{{ secCards }}\" as=\"c\" hint-placeholder-count=\"5\">\n              <div style=\"border: 1px solid #E4D8BF; border-radius: 6px; padding: 12px 14px; background: #F7F1E4;\">\n                <div style=\"font-size: 13px; font-weight: 500; color: #2E2418; margin-bottom: 8px;\">{{ c.province }}<\u002Fdiv>\n                <div style=\"display: flex; height: 26px; border-radius: 3px; overflow: hidden;\">\n                  <sc-for list=\"{{ c.segs }}\" as=\"s\" hint-placeholder-count=\"3\">\n                    <div title=\"{{ s.title }}\" style=\"{{ s.style }}\">{{ s.label }}<\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display: flex; gap: 18px; flex-wrap: wrap; margin-top: 14px;\">\n            <div style=\"display: flex; gap: 6px; align-items: center; font-size: 12.5px; color: #6E6047;\"><span style=\"width: 11px; height: 11px; border-radius: 2px; background: #4A5D3A;\"><\u002Fspan>Agriculture, forestry &amp; fishing<\u002Fdiv>\n            <div style=\"display: flex; gap: 6px; align-items: center; font-size: 12.5px; color: #6E6047;\"><span style=\"width: 11px; height: 11px; border-radius: 2px; background: #5C4632;\"><\u002Fspan>Industry<\u002Fdiv>\n            <div style=\"display: flex; gap: 6px; align-items: center; font-size: 12.5px; color: #6E6047;\"><span style=\"width: 11px; height: 11px; border-radius: 2px; background: #C98A3B;\"><\u002Fspan>Services<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size: 12px; color: #9A8A6E; line-height: 1.55; margin-top: 10px; max-width: 88ch;\">The dataset carries the full 2018–2024 provincial series; this panel deliberately shows the 2024 cross-section. Four component sums reproduce published GRDP exactly; Tawi-Tawi's independently rounded components sum to ₱26.03B against the brief's ₱26.02B — an explicit source-rounding inconsistency, carried rather than smoothed.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div data-panel=\"1\" data-screen-label=\"V5 targets\" style=\"background: #FBF6EA; border: 1px solid #E4D8BF; border-radius: 10px; padding: 28px 30px; margin-top: 22px; box-shadow: 0 1px 3px rgba(46,36,24,.05);\">\n          <div style=\"display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; flex-wrap: wrap;\">\n            <div style=\"max-width: 64ch;\">\n              <h3 style=\"font-family: 'Marcellus', Georgia, serif; font-size: 21px; color: #2E2418; margin: 0; font-weight: 400;\">Performance against the FY2027 budget priorities framework<\u002Fh3>\n              <p style=\"font-size: 13.5px; line-height: 1.6; color: #6E6047; margin: 8px 0 0;\">Gold band is the target range; the filled dot is the 2024 actual, rust where it sits below target; the hollow dot is the 2022 baseline and the arrow marks the 2028 end-of-plan level.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"display: flex; gap: 10px; align-items: center;\">\n              <x-import component-from-global-scope=\"MindanaoDesignSystem_94fd56.Badge\" tone=\"neutral\" hint-size=\"auto,22px\">Published values<\u002Fx-import>\n              <x-import component-from-global-scope=\"MindanaoDesignSystem_94fd56.Button\" variant=\"secondary\" size=\"sm\" sc-camel-on-click=\"{{ dl.v5 }}\" hint-size=\"auto,34px\">CSV<\u002Fx-import>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; margin-top: 20px;\">\n            <sc-for list=\"{{ gauges }}\" as=\"g\" hint-placeholder-count=\"11\">\n              <div style=\"border: 1px solid #E4D8BF; border-radius: 6px; padding: 12px 14px; background: #F7F1E4;\">\n                <div style=\"font-size: 13px; font-weight: 500; color: #2E2418;\">{{ g.indicator }}<\u002Fdiv>\n                <svg sc-camel-view-box=\"0 0 240 40\" style=\"width: 100%; height: 44px; display: block; margin: 4px 0;\">\n                  {{ g.el }}\n                <\u002Fsvg>\n                <div style=\"font-size: 12.5px; color: #6E6047; font-variant-numeric: tabular-nums;\">{{ g.summary }} · {{ g.target }}<\u002Fdiv>\n                <sc-if value=\"{{ g.hasNote }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"font-size: 11.5px; color: #9A8A6E; margin-top: 3px; line-height: 1.4;\">{{ g.note }}<\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"font-size: 12px; color: #9A8A6E; line-height: 1.55; margin-top: 12px; max-width: 88ch;\">Source: BBM 2026-005 budget priorities framework · <code>barmm_targets.csv<\u002Fcode>. Poverty incidence is the exception on every axis: its baseline is 2021 and its status 2023, and no 2027 target is published — shown as a gap rather than filled in.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div id=\"needs\" style=\"padding-top: 56px;\">\n        <div style=\"display: flex; align-items: baseline; gap: 16px; padding-bottom: 6px; border-bottom: 1px solid #D9CDB6;\">\n          <span style=\"font-family: 'Marcellus', Georgia, serif; font-size: 15px; color: #9A8A6E;\">06<\u002Fspan>\n          <h2 style=\"font-family: 'Marcellus', Georgia, serif; font-size: 30px; color: #2E2418; margin: 0; font-weight: 400;\">Investment needs<\u002Fh2>\n          <span style=\"font-size: 13.5px; color: #6E6047; margin-left: auto;\">What the recovery plan says it costs<\u002Fspan>\n        <\u002Fdiv>\n\n        <div data-panel=\"1\" data-screen-label=\"V11 BRRP needs\" style=\"background: #FBF6EA; border: 1px solid #E4D8BF; border-left: 3px solid #4A5D3A; border-radius: 10px; padding: 28px 30px; margin-top: 24px; box-shadow: 0 1px 3px rgba(46,36,24,.05);\">\n          <div style=\"display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; flex-wrap: wrap;\">\n            <div style=\"max-width: 64ch;\">\n              <h3 style=\"font-family: 'Marcellus', Georgia, serif; font-size: 21px; color: #2E2418; margin: 0; font-weight: 400;\">Rehabilitation and recovery requirements by sector, 2023–2028<\u002Fh3>\n              <p style=\"font-size: 13.5px; line-height: 1.6; color: #6E6047; margin: 8px 0 0;\">Six sectors as published. Bars are the six-year grand total only; the annual funded-versus-proposed breakdown is not used.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"display: flex; gap: 10px; align-items: center;\">\n              <x-import component-from-global-scope=\"MindanaoDesignSystem_94fd56.Badge\" tone=\"success\" hint-size=\"auto,22px\">Measured<\u002Fx-import>\n              <x-import component-from-global-scope=\"MindanaoDesignSystem_94fd56.Button\" variant=\"secondary\" size=\"sm\" sc-camel-on-click=\"{{ dl.v11 }}\" hint-size=\"auto,34px\">CSV<\u002Fx-import>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1px; background: #E4D8BF; border: 1px solid #E4D8BF; border-radius: 8px; overflow: hidden; margin: 20px 0 18px;\">\n            <sc-for list=\"{{ v11Kpis }}\" as=\"k\" hint-placeholder-count=\"4\">\n              <div style=\"background: #F7F1E4; padding: 14px 16px;\">\n                <div style=\"font-family: 'Karla'; font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: #9A8A6E; font-weight: 500;\">{{ k.label }}<\u002Fdiv>\n                <div style=\"font-family: 'Marcellus', Georgia, serif; font-size: 21px; color: #2E2418; margin-top: 6px; font-variant-numeric: tabular-nums;\">{{ k.value }}<\u002Fdiv>\n                <div style=\"font-size: 11.5px; color: #6E6047; margin-top: 2px; line-height: 1.4;\">{{ k.sub }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <svg sc-camel-view-box=\"{{ v11VB }}\" style=\"width: 100%; height: auto; display: block; overflow: visible;\">\n            {{ v11El }}\n          <\u002Fsvg>\n          <sc-if value=\"{{ showDetail }}\" hint-placeholder-val=\"{{ true }}\">\n            <details style=\"margin-top: 14px;\">\n              <summary style=\"cursor: pointer; font-family: 'Karla'; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #A85C32; font-weight: 500; padding: 8px 0;\">Verification, the missing second bar, and the sector table ▾<\u002Fsummary>\n              <div style=\"font-size: 13.5px; line-height: 1.7; color: #6E6047; max-width: 84ch;\">\n                <p style=\"margin: 0 0 10px;\"><strong style=\"color: #2E2418;\">Verified at two independent locations and reconciled.<\u002Fstrong> The sector table appears twice in the plan — as Table 8.1 in Chapter 8.2 (PDF p. 136) and again as the lead summary of Annex C (PDF p. 191). Both copies are identical in every cell, and the six totals sum to ₱8,830,690,000.00, matching the chapter's own headline sentence exactly. The year columns are garbled in plain-text extraction — a merged-cell header artefact, not a data error — so this panel reads only the grand-total column.<\u002Fp>\n                <p style=\"margin: 0 0 12px;\"><strong style=\"color: #2E2418;\">Not built: the diverging comparison against actual capital spend.<\u002Fstrong> The spec pairs these requirements against actual capital-outlay spend by sector. That side does not exist at any extractable level: the sector column is empty on all 427 rows, and a ministry-to-sector crosswalk is unbuildable rather than merely lossy — ministry rows carry only all-instrument totals, and capital-outlay rows carry only the region-wide aggregate. The source never crosses the two, so a per-ministry capital figure to map onto sectors does not exist to extract.<\u002Fp>\n                <div style=\"overflow-x: auto;\">\n                  <sc-raw-table style=\"width: 100%; min-width: 560px; border-collapse: collapse; font-size: 12.5px;\">\n                    <sc-raw-thead>\n                      <sc-raw-tr>\n                        <sc-raw-th style=\"text-align: left; padding: 7px 8px; border-bottom: 1.5px solid #C9B889; font-family: Karla; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: #9A8A6E; font-weight: 500;\">Sector<\u002Fsc-raw-th>\n                        <sc-raw-th style=\"text-align: right; padding: 7px 8px; border-bottom: 1.5px solid #C9B889; font-family: Karla; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: #9A8A6E; font-weight: 500;\">2023–2028 total<\u002Fsc-raw-th>\n                        <sc-raw-th style=\"text-align: right; padding: 7px 8px; border-bottom: 1.5px solid #C9B889; font-family: Karla; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: #9A8A6E; font-weight: 500;\">Share<\u002Fsc-raw-th>\n                      <\u002Fsc-raw-tr>\n                    <\u002Fsc-raw-thead>\n                    <sc-raw-tbody>\n                      <sc-for list=\"{{ v11Rows }}\" as=\"r\" hint-placeholder-count=\"6\">\n                        <sc-raw-tr>\n                          <sc-raw-td style=\"padding: 6px 8px; border-bottom: 1px solid #E4D8BF;\">{{ r.sector }}<\u002Fsc-raw-td>\n                          <sc-raw-td style=\"padding: 6px 8px; border-bottom: 1px solid #E4D8BF; text-align: right; font-variant-numeric: tabular-nums;\">{{ r.php }}<\u002Fsc-raw-td>\n                          <sc-raw-td style=\"padding: 6px 8px; border-bottom: 1px solid #E4D8BF; text-align: right; font-variant-numeric: tabular-nums;\">{{ r.share }}<\u002Fsc-raw-td>\n                        <\u002Fsc-raw-tr>\n                      <\u002Fsc-for>\n                      <sc-raw-tr>\n                        <sc-raw-td style=\"padding: 7px 8px; border-top: 1.5px solid #C9B889; font-weight: 700;\">Total<\u002Fsc-raw-td>\n                        <sc-raw-td style=\"padding: 7px 8px; border-top: 1.5px solid #C9B889; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums;\">{{ v11Total.php }}<\u002Fsc-raw-td>\n                        <sc-raw-td style=\"padding: 7px 8px; border-top: 1.5px solid #C9B889; text-align: right; font-weight: 700;\">100.0%<\u002Fsc-raw-td>\n                      <\u002Fsc-raw-tr>\n                    <\u002Fsc-raw-tbody>\n                  <\u002Fsc-raw-table>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdetails>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div id=\"gaps\" style=\"padding-top: 56px;\">\n        <div style=\"display: flex; align-items: baseline; gap: 16px; padding-bottom: 6px; border-bottom: 1px solid #D9CDB6;\">\n          <span style=\"font-family: 'Marcellus', Georgia, serif; font-size: 15px; color: #9A8A6E;\">07<\u002Fspan>\n          <h2 style=\"font-family: 'Marcellus', Georgia, serif; font-size: 30px; color: #2E2418; margin: 0; font-weight: 400;\">What we cannot show yet<\u002Fh2>\n          <span style=\"font-size: 13.5px; color: #6E6047; margin-left: auto;\">Named, defined, and openly unbuilt<\u002Fspan>\n        <\u002Fdiv>\n\n        <div data-panel=\"1\" data-screen-label=\"Gaps\" style=\"background: #FBF6EA; border: 1px solid #E4D8BF; border-radius: 10px; padding: 30px 32px; margin-top: 24px; box-shadow: 0 1px 3px rgba(46,36,24,.05);\">\n          <p style=\"font-size: 16px; line-height: 1.75; color: #3A2E1E; margin: 0 0 24px; max-width: 72ch; font-weight: 300;\">Six things this dashboard is asked to show and does not. Each is left visibly absent rather than filled with a modelled stand-in, because in every case the invented number would sit on exactly the axis the chart exists to prove. Rechecked against fresh public sources on 11 August 2026.<\u002Fp>\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px;\">\n            <div style=\"border-left: 2px solid #A85C32; padding: 4px 0 4px 16px;\">\n              <div style=\"font-family: 'Karla'; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #A85C32; font-weight: 500;\">Not found<\u002Fdiv>\n              <div style=\"font-family: 'Marcellus', Georgia, serif; font-size: 18px; color: #2E2418; margin: 6px 0 6px;\">C1 — procurement localisation by value<\u002Fdiv>\n              <div style=\"font-size: 13.5px; line-height: 1.65; color: #6E6047;\">Public data gives merchant counts, never award value linked to a supplier address. So no value-weighted local share, no concentration curve, and no \"leaked outside BARMM\" node in the flow map. Confirmed not found again on recheck.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"border-left: 2px solid #A85C32; padding: 4px 0 4px 16px;\">\n              <div style=\"font-family: 'Karla'; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #A85C32; font-weight: 500;\">Not found<\u002Fdiv>\n              <div style=\"font-family: 'Marcellus', Georgia, serif; font-size: 18px; color: #2E2418; margin: 6px 0 6px;\">Personnel services by province<\u002Fdiv>\n              <div style=\"font-size: 13.5px; line-height: 1.65; color: #6E6047;\">The province column is empty on all 427 rows: the source reports by instrument and by ministry, never by province. That blocks the salary-versus-bank-density overlay. A civil-service headcount was evaluated as a proxy and rejected — headcount not pesos, local-government staff only, and a pre-2024 province map.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"border-left: 2px solid #C98A3B; padding: 4px 0 4px 16px;\">\n              <div style=\"font-family: 'Karla'; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #B0752C; font-weight: 500;\">Narrowed, not closed<\u002Fdiv>\n              <div style=\"font-family: 'Marcellus', Georgia, serif; font-size: 18px; color: #2E2418; margin: 6px 0 6px;\">Sub-annual timing of the Special Fund loop<\u002Fdiv>\n              <div style=\"font-size: 13.5px; line-height: 1.65; color: #6E6047;\">Sixteen Special Fund SARO issue dates were found for FY2024 — the first release-side timestamps in this project. They are still not obligation or disbursement dates, and they cover one of three completed cohorts, so the lag stays at whole-fiscal-year resolution.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"border-left: 2px solid #C98A3B; padding: 4px 0 4px 16px;\">\n              <div style=\"font-family: 'Karla'; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #B0752C; font-weight: 500;\">Partly found<\u002Fdiv>\n              <div style=\"font-family: 'Marcellus', Georgia, serif; font-size: 18px; color: #2E2418; margin: 6px 0 6px;\">C3 — deposit capture and re-lending<\u002Fdiv>\n              <div style=\"font-size: 13.5px; line-height: 1.65; color: #6E6047;\">The banking half arrived: BARMM deposits ₱150.208B against loans ₱8.431B, March 2026. Region-wide only, so it corroborates the low re-lending rate without unblocking the province resolution C3 needs. No slider stands in for it.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"border-left: 2px solid #9A8A6E; padding: 4px 0 4px 16px;\">\n              <div style=\"font-family: 'Karla'; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #9A8A6E; font-weight: 500;\">Unresolved<\u002Fdiv>\n              <div style=\"font-family: 'Marcellus', Georgia, serif; font-size: 18px; color: #2E2418; margin: 6px 0 6px;\">The unbanked-rate denominator<\u002Fdiv>\n              <div style=\"font-size: 13.5px; line-height: 1.65; color: #6E6047;\">Three sources give three counts of BARMM local governments — 116, 119 and 108. A third disagreeing figure does not adjudicate between the other two, so 78.4% is stated once, region-wide, and never per province.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"border-left: 2px solid #9A8A6E; padding: 4px 0 4px 16px;\">\n              <div style=\"font-family: 'Karla'; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #9A8A6E; font-weight: 500;\">Retired<\u002Fdiv>\n              <div style=\"font-family: 'Marcellus', Georgia, serif; font-size: 18px; color: #2E2418; margin: 6px 0 6px;\">The composite circularity index<\u002Fdiv>\n              <div style=\"font-size: 13.5px; line-height: 1.65; color: #6E6047;\">Dead as specified: it requires a province dimension that exists nowhere in the data, and C1 is unrecoverable. Recorded as a decision in the methodology note rather than left implied.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top: 26px; padding-top: 20px; border-top: 1px solid #E4D8BF;\">\n            <div style=\"font-family: 'Karla'; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #9A8A6E; font-weight: 500; margin-bottom: 10px;\">Dataset-level gaps carried forward<\u002Fdiv>\n            <ul style=\"font-size: 13.5px; line-height: 1.8; color: #6E6047; margin: 0; padding-left: 20px; max-width: 84ch;\">\n              <li>Local government own-source revenue is invisible — only shares downloaded to them are tracked.<\u002Fli>\n              <li>Private investment is not tracked at BARMM level at all.<\u002Fli>\n              <li>Ministry reporting is asynchronous within a single year-end report; FY2024–25 columns are ceilings, not finals.<\u002Fli>\n              <li>The Sulu discontinuity means post-2024 five-province figures are not comparable to pre-2024 six-province ones.<\u002Fli>\n              <li>Provincial population, and therefore every per-capita fiscal metric, is not yet in the dataset.<\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"margin-top: 56px; padding: 30px 32px; background: #F0E6CF; border-radius: 10px;\">\n        <div style=\"font-family: 'Karla'; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #9A8A6E; font-weight: 500;\">Data &amp; method<\u002Fdiv>\n        <p style=\"font-size: 14px; line-height: 1.75; color: #3A2E1E; margin: 12px 0 0; max-width: 82ch;\">Every chart on this page is generated from published source documents, and every peso figure traces to a named document and page. Never mix accounting bases in one chart; every OCR-derived row failing its checksum carries low confidence and a visible warning; Sulu is excluded from BARMM series after 9 September 2024 with a visible break, not a silent gap. Underlying tables: <code>barmm_flows.csv<\u002Fcode> (427 rows), <code>barmm_indicators.csv<\u002Fcode> (213 rows), <code>barmm_targets.csv<\u002Fcode>, <code>barmm_c4_reappropriation.csv<\u002Fcode>, <code>barmm_saro_releases.csv<\u002Fcode>, <code>barmm_saro_special_fund.csv<\u002Fcode> and <code>barmm_dashboard_supplement.csv<\u002Fcode>.
