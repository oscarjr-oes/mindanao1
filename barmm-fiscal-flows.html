  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;

    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }

        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];

            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();

            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;

            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }

            (entry.compressed ? toBase64(finalBytes) : entry.data);

          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);

        console.error('Failed to decode asset ' + uuid + ':', err);

        resourceBlobs[blobUrls[uuid]] = blob;

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {

    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

tyle>\n<script src=\"9fcc19f7-b8ff-4cef-b46c-ae98d79eadf5\"><\u002Fscript>\n<style>\n  body { margin: 0; background: #EDE7DB; font-family: 'Karla', 'Helvetica Neue', sans-serif; color: #3A2E1E; -webkit-font-smoothing: antialiased; }\n  * { box-sizing: border-box; }\n  a { color: #A85C32; text-decoration: none; }\n  a:hover { color: #96502A; text-decoration: underline; }\n  summary { list-style: none; }\n  summary::-webkit-details-marker { display: none; }\n  @page { margin: 12mm; }\n  @media print {\n    body { background: #fff; }\n    [data-rail] { display: none; }\n    [data-main] { margin-left: 0 !important; }\n    [data-panel] { break-inside: avoid; box-shadow: none; }\n  }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div data-rail=\"1\" style=\"position: fixed; top: 0; left: 0; bottom: 0; width: 264px; background: #FBF6EA; border-right: 1px solid #D9CDB6; padding: 32px 24px; overflow-y: auto; z-index: 20; display: flex; flex-direction: column; gap: 26px;\">\n  <div>\n    <div style=\"font-family: 'Karla'; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #9A8A6E; font-weight: 500;\">Bangsamoro · MFBM<\u002Fdiv>\n    <div style=\"font-family: 'Marcellus', Georgia, serif; font-size: 25px; line-height: 1.15; color: #2E2418; margin-top: 8px;\">Fiscal &amp; economic flows<\u002Fdiv>\n    <div style=\"font-size: 13px; color: #6E6047; line-height: 1.5; margin-top: 8px;\">Public money traced from block grant to outcome, and back again.<\u002Fdiv>\n  <a href=\"index.html\" style=\"font-size: 12px; color: #A85C32; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; font-family: 'Karla'; font-weight: 500; margin-top: 4px;\">\u2190 Back to landing page<\u002Fa>\n  <\u002Fdiv>\n\n  <div style=\"height: 1px; background: #E4D8BF;\"><\u002Fdiv>\n\n  <div style=\"display: flex; flex-direction: column; gap: 14px;\">\n    <div style=\"font-family: 'Karla'; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #9A8A6E; font-weight: 500;\">Global view<\u002Fdiv>\n    <x-import component-from-global-scope=\"MindanaoDesignSystem_94fd56.Select\" label=\"Fiscal year\" options=\"{{ fyOptions }}\" value=\"{{ fyLabel }}\" sc-camel-on-change=\"{{ onFY }}\" hint-size=\"100%,64px\"><\u002Fx-import>\n    <div>\n      <div style=\"font-family: 'Karla'; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #9A8A6E; font-weight: 500; margin-bottom: 6px;\">Accounting basis<\u002Fdiv>\n      <div style=\"display: flex; gap: 0; border: 1px solid #C9B889; border-radius: 999px; overflow: hidden;\">\n        <button sc-camel-on-click=\"{{ setObl }}\" style=\"{{ oblStyle }}\">Obligation<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ setDisb }}\" style=\"{{ disbStyle }}\">Disbursement<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"font-size: 12px; color: #9A8A6E; line-height: 1.45; margin-top: 8px;\">Never mixed in one chart. Applies to the flow map, the waterfall and the leakage model.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"height: 1px; background: #E4D8BF;\"><\u002Fdiv>\n\n  <div style=\"display: flex; flex-direction: column; gap: 2px;\">\n    <div style=\"font-family: 'Karla'; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #9A8A6E; font-weight: 500; margin-bottom: 8px;\">Sections<\u002Fdiv>\n    <sc-for list=\"{{ nav }}\" as=\"n\" hint-placeholder-count=\"7\">\n      <a href=\"{{ n.href }}\" style=\"font-size: 14px; color: #3A2E1E; padding: 7px 10px; border-radius: 6px; display: flex; gap: 10px; align-items: baseline;\" style-hover=\"background: #F0E6CF;\">\n        <span style=\"font-size: 11px; color: #9A8A6E; font-variant-numeric: tabular-nums;\">{{ n.num }}<\u002Fspan>\n        <span>{{ n.label }}<\u002Fspan>\n      <\u002Fa>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <div style=\"height: 1px; background: #E4D8BF;\"><\u002Fdiv>\n\n  <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n    <x-import component-from-global-scope=\"MindanaoDesignSystem_94fd56.Button\" variant=\"secondary\" size=\"sm\" sc-camel-on-click=\"{{ togglePresent }}\" hint-size=\"100%,36px\">{{ presentLabel }}<\u002Fx-import>\n    <x-import component-from-global-scope=\"MindanaoDesignSystem_94fd56.Button\" variant=\"ghost\" size=\"sm\" sc-camel-on-click=\"{{ printPage }}\" hint-size=\"100%,36px\">Print / save as PDF<\u002Fx-import>\n  <\u002Fdiv>\n\n  <div style=\"margin-top: auto; font-size: 12px; color: #9A8A6E; line-height: 1.5;\">\n    Data as of 11 Aug 2026. Sources: MFBM, PSA, BSP, BPDA, AAIIBP. Every figure traces to a named document and page.\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div data-main=\"1\" style=\"margin-left: 264px; padding: 0 0 80px;\">\n<div style=\"{{ zoomStyle }}\">\n\n  <div style=\"padding: 54px 56px 30px; background: #F7F1E4; border-bottom: 1px solid #E4D8BF;\">\n    <div style=\"max-width: 1180px;\">\n      <div style=\"font-family: 'Karla'; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #9A8A6E; font-weight: 500;\">Fiscal year {{ fy }} · {{ basisLabel }} basis<\u002Fdiv>\n      <h1 style=\"font-family: 'Marcellus', Georgia, serif; font-size: 44px; line-height: 1.12; color: #2E2418; margin: 14px 0 0; font-weight: 400; max-width: 20ch;\">Where the block grant goes<\u002Fh1>\n      <p style=\"font-size: 18px; line-height: 1.65; color: #6E6047; max-width: 62ch; margin: 16px 0 0; font-weight: 300; text-wrap: pretty;\">One region's public money, followed from release to execution — and, where the law sends it back, around the Special Fund loop and out again two to three years later.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding: 0 56px;\">\n    <div style=\"max-width: 1180px; margin: 0 auto;\">\n\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 1px; background: #E4D8BF; border: 1px solid #E4D8BF; border-radius: 10px; overflow: hidden; margin-top: 32px;\">\n        <sc-for list=\"{{ top v>\n        <\u002Fdiv>\n\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 1px; background: #E4D8BF; border: 1px solid #E4D8BF; border-radius: 8px; overflow: hidden; margin: 22px 0 6px;\">\n          <sc-for list=\"{{ heroKpis }}\" as=\"k\" hint-placeholder-count=\"5\">\n            <div style=\"background: #F7F1E4; padding: 14px 16px;\">\n              <div style=\"font-family: 'Karla'; font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: #9A8A6E; font-weight: 500;\">{{ k.label }}<\u002Fdiv>\n              <div style=\"font-family: 'Marcellus', Georgia, serif; font-size: 22px; color: #2E2418; margin-top: 6px; font-variant-numeric: tabular-nums;\">{{ k.value }}<\u002Fdiv>\n              <div style=\"font-size: 11.5px; color: #6E6047; margin-top: 2px;\">{{ k.sub }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"overflow-x: auto; margin: 0 -4px;\">\n        <svg sc-camel-view-box=\"{{ heroVB }}\" style=\"width: 100%; min-width: 860px; height: auto; display: block; overflow: visible;\">\n          <defs>\n            <marker id=\"arrEnd\" sc-camel-view-box=\"0 0 10 10\" sc-camel-ref-x=\"6\" sc-camel-ref-y=\"5\" sc-camel-marker-width=\"12\" sc-camel-marker-height=\"12\" sc-camel-marker-units=\"userSpaceOnUse\" orient=\"auto-start-reverse\">\n              <path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#C98A3B\"><\u002Fpath>\n            <\u002Fmarker>\n            <pattern id=\"hFern\" width=\"6\" height=\"6\" sc-camel-pattern-transform=\"rotate(45)\" sc-camel-pattern-units=\"userSpaceOnUse\">\n              <rect width=\"6\" height=\"6\" fill=\"#F0E6CF\"><\u002Frect>\n              <line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"6\" stroke=\"#4A5D3A\" stroke-width=\"2.2\"><\u002Fline>\n            <\u002Fpattern>\n            <pattern id=\"hRust\" width=\"6\" height=\"6\" sc-camel-pattern-transform=\"rotate(45)\" sc-camel-pattern-units=\"userSpaceOnUse -width: 78ch;\">\n              <p style=\"margin: 0 0 10px;\">Simplified from the full five-column Source→Channel→Instrument→Sector→Destination taxonomy: <code>barmm_flows.csv<\u002Fcode> carries no per-ministry instrument split and no province or sector split, so those columns are not drawn rather than invented. There is no \"leaked outside BARMM\" node here — that estimate needs the C1 procurement-localisation metric, which is unavailable at value level.<\u002Fp>\n              <p style=\"margin: 0 0 10px;\">\"Total available\" = SARO release + re-appropriation inflow. The basis selector uses <strong>one accounting basis at a time<\u002Fstrong> for every instrument and outcome; no obligation amount flows into a disbursement node. All six annual fund identities checksum exactly (spec §8.3).<\u002Fp>\n              <p style=\"margin: 0;\">Source: <code>SUMMARY-OF-2020-2025-BLOCK-GRANT-UTILIZATION-AS-OF-DECEMBER-31-2025.pdf<\u002Fcode>, pp. 1–2 · <code>barmm_flows.csv<\u002Fcode>. The PDF has no text layer; figures were read from a 6–7× native render, not OCR.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdetails>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div id=\"money\" style=\"padding-top: 56px;\">\n        <div style=\"display: flex; align-items: baseline; gap: 16px; padding-bottom: 6px; border-bottom: 1px solid #D9CDB6;\">\n          <span style=\"font-family: 'Marcellus', Georgia, serif; font-size: 15px; color: #9A8A6E;\">01<\u002Fspan>\n          <h2 style=\"font-family: 'Marcellus', Georgia, serif; font-size: 30px; color: #2E2418; margin: 0; font-weight: 400;\">The money<\u002Fh2>\n          <span style=\"font-size: 13.5px; color: #6E6047; margin-left: auto;\">Release, utilisation, and the calendar it arrives on<\u002Fspan>\n        <\u002Fdiv>\n\n        <div data-panel=\"1\" data-screen-label=\"V3 waterfall\" style=\"background: #FBF6EA; border: 1px solid #E4D8BF; border-radius: 10px; padding: 28px 30px; margin-top: 24px; box-shadow: 0 1px 3px rgba(46,36,24,.05);\">\n          <div style=\"display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; flex-wrap: wrap;\">\n            <div style=\"max-width: 60ch;\">\n              <h3 style=\"font-family: 'Marcellus', Georgia, serif; font-size: 21px; color: #2E2418; margin: 0; font-weight: 400;\">Utilisation waterfall, FY{{ fy }}<\u002Fh3>\n              <p style=\"font-size: 13.5px; line-height: 1.6; color: #6E6047; margin: 6px 0 0;\">Every peso available, spent down instrument by instrument. Obligation basis. Under §19 the remainder is reverted for re-appropriation, not simply lost.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"display: flex; gap: 10px; align-items: center;\">\n              <x-import component-from-global-scope=\"MindanaoDesignSystem_94fd56.Badge\" tone=\"success\" hint-size=\"auto,22px\">Measured<\u002Fx-import>\n              <x-import component-from-global-scope=\"MindanaoDesignSystem_94fd56.Button\" variant=\"secondary\" size=\"sm\" sc-camel-on-click=\"{{ dl.v3 }}\" hint-size=\"auto,34px\">CSV<\u002Fx-import>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ v3AsOf }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top: 12px;\">\n              <x-import component-from-global-scope=\"MindanaoDesignSystem_94fd56.Badge\" tone=\"warning\" hint-size=\"auto,22px\">Mixed cutoffs · {{ v3AsOf }}<\u002Fx-import>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <svg sc-camel-view-box=\"{{ v3VB }}\" style=\"width: 100%; height: auto; display: block; margin-top: 16px; overflow: visible;\">\n            {{ v3El }}\n          <\u002Fsvg>\n          <div style=\"font-size: 13.5px; line-height: 1.6; color: #3A2E1E; background: #F0E6CF; border-radius: 6px; padding: 12px 14px; margin-top: 14px;\">{{ v3Note }}<\u002Fdiv>\n          <sc-if value=\"{{ showDetail }}\" hint-placeholder-val=\"{{ true }}\">\n            <details style=\"margin-top: 12px;\">\n              <summary style=\"cursor: pointer; font-family: 'Karla'; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #A85C32; font-weight: 500; padding: 8px 0;\">Notes &amp; sources ▾<\u002Fsummary>\n              <div style=\"font-size: 13.5px; line-height: 1.7; color: #6E6047; max-width: 78ch;\">\n                <p style=\"margin: 0;\">Source: block grant utilization summary, pp. 1, 7–8 · <code>barmm_flows.csv<\u002Fcode>, BARMM-Government aggregate, obligation basis. FY2020–2022 separately itemise the reverted outflow; FY2023–2025 report only the retained balance. The FY2024–25 badge discloses the ministry reporting cutoffs underlying those aggregate columns — thirteen agencies at 30 Sep 2025, three at 30 Jun 2025, two at 31 Dec 2024 (FY2024) — so those unobligated pools are ceilings, not final figures.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdetails>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div data-panel=\"1\" data-screen-label=\"V12 SARO timing\" style=\"background: #FBF6EA; border: 1px solid #E4D8BF; border-radius: 10px; padding: 28px 30px; margin-top: 22px; box-shadow: 0 1px 3px rgba(46,36,24,.05);\">\n          <div style=\"display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; flex-wrap: wrap;\">\n            <div style=\"max-width: 60ch;\">\n              <h3 style=\"font-family: 'Marcellus', Georgia, serif; font-size: 21px; color: #2E2418; margin: 0; font-weight: 400;\">When the money actually lands<\u002Fh3>\n              <p style=\"font-size: 13.5px; line-height: 1.6; color: #6E6047; margin: 6px 0 0;\">Every block grant SARO, FY2020–2025, placed on the calendar day it was issued. Circle area is the tranche amount. Release dates only — no source publishes an obligation or disbursement date.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"display: flex; gap: 10px; align-items: center;\">\n              <x-import component-from-global-scope=\"MindanaoDesignSystem_94fd56.Badge\" tone=\"success\" hint-size=\"auto,22px\">Measured<\u002Fx-import>\n              <x-import component-from-global-scope=\"MindanaoDesignSystem_94fd56.Button\" variant=\"secondary\" size=\"sm\" sc-camel-on-click=\"{{ dl.v12 }}\" hint-size=\"auto,34px\">CSV<\u002Fx-import>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: #E4D8BF; border: 1px solid #E4D8BF; border-radius: 8px; overflow: hidden; margin: 18px 0 4px;\">\n            <sc-for list=\"{{ v12Kpis }}\" as=\"k\" hint-placeholder-count=\"4\">\n              <div style=\"background: #F7F1E4; padding: 13px 15px;\">\n                <div style=\"font-family: 'Karla'; font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: #9A8A6E; font-weight: 500;\">{{ k.label }}<\u002Fdiv>\n                <div style=\"font-family: 'Marcellus', Georgia, serif; font-size: 20px; color: #2E2418; margin-top: 5px; font-variant-numeric: tabular-nums;\">{{ k.value }}<\u002Fdiv>\n                <div style=\"font-size: 11.5px; color: #6E6047; margin-top: 2px;\">{{ k.sub }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <svg sc-camel-view-box=\"{{ v12VB }}\" style=\"width: 100%; height: auto; display: block; margin-top: 14px; overflow: visible;\">\n            {{ v12El }}\n          <\u002Fsvg>\n          <div style=\"display: flex; gap: 20px; flex-wrap: wrap; margin-top: 10px; font-size: 12.5px; color: #6E6047;\">\n            <div style=\"display: flex; gap: 7px; align-items: center;\"><span style=\"width: 11px; height: 11px; border-radius: 50%; background: #4A5D3A;\"><\u002Fspan>First tranche<\u002Fdiv>\n            <div style=\"display: flex; gap: 7px; align-items: center;\"><span style=\"width: 11px; height: 11px; border-radius: 50%; background: #5C4632;\"><\u002Fspan>Second tranche<\u002Fdiv>\n            <div style=\"display: flex; gap: 7px; align-items: center;\"><span style=\"width: 11px; height: 11px; border-radius: 50%; background: #A85C32;\"><\u002Fspan>FY2024 anomaly pair — identical SARO number and date<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size: 13.5px; line-height: 1.6; color: #3A2E1E; background: #F0E6CF; border-radius: 6px; padding: 12px 14px; margin-top: 14px;\">Release is front-loaded. Every year's first tranche lands in January and typically carries the smaller share; the second, larger tranche arrives three weeks to two months later. This says when money became available — not when it was obligated or spent.<\u002Fdiv>\n          <sc-if value=\"{{ showDetail }}\" hint-placeholder-val=\"{{ true }}\">\n            <details style=\"margin-top: 12px;\">\n              <summary style=\"cursor: pointer; font-family: 'Karla'; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #A85C32; font-weight: 500; padding: 8px 0;\">Notes, source anomaly &amp; the full tranche table ▾<\u002Fsummary>\n              <div style=\"font-size: 13.5px; line-height: 1.7; color: #6E6047; max-width: 78ch;\">\n                <p style=\"margin: 0 0 10px; border-left: 2px solid #A85C32; padding-left: 12px;\"><strong style=\"color: #2E2418;\">Source anomaly, flagged rather than silently resolved.<\u002Fstrong> FY2024's two tranches are both printed with the identical SARO number and date — SARO-LGRCB-24-0000013, 17 January 2024 — despite carrying different amounts (₱54,315,660,000.00 and ₱16,197,565,000.00). Every other year has two distinct numbers on two distinct dates, and the two FY2024 amounts sum exactly to the year's published total, so this reads as two genuine releases with one number mistranscribed in the source document. Held at medium confidence for this pair only.<\u002Fp>\n                <p style=\"margin: 0 0 12px;\">Source: block grant utilization summary, per-year detail sheets pp. 3–8. Every tranche checksums exactly against that year's Total Block Grant Received in <code>barmm_flows.csv<\u002Fcode>. Data: <code>barmm_saro_releases.csv<\u002Fcode>.<\u002Fp>\n                <div style=\"overflow-x: auto;\">\n                  <sc-raw-table style=\"width: 100%; min-width: 640px; border-collapse: collapse; font-size: 12.5px;\">\n                    <sc-raw-thead>\n                      <sc-raw-tr>\n                        <sc-raw-th style=\"text-align: left; padding: 7px 8px; border-bottom: 1.5px solid #C9B889; font-family: Karla; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: #9A8A6E; font-weight: 500;\">FY<\u002Fsc-raw-th>\n                        <sc-raw-th style=\"text-align: left; padding: 7px 8px; border-bottom: 1.5px solid #C9B889; font-family: Karla; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: #9A8A6E; font-weight: 500;\">SARO number<\u002Fsc-raw-th>\n                        <sc-raw-th style=\"text-align: left; padding: 7px 8px; border-bottom: 1.5px solid #C9B889; font-family: Karla; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: #9A8A6E; font-weight: 500;\">Date<\u002Fsc-raw-th>\n                        <sc-raw-th style=\"text-align: right; padding: 7px 8px; border-bottom: 1.5px solid #C9B889; font-family: Karla; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: #9A8A6E; font-weight: 500;\">Amount<\u002Fsc-raw-th>\n                        <sc-raw-th style=\"text-align: left; padding: 7px 8px; border-bottom: 1.5px solid #C9B889; font-family: Karla; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: #9A8A6E; font-weight: 500;\">Conf.<\u002Fsc-raw-th>\n                        <sc-raw-th style=\"text-align: left; padding: 7px 8px; border-bottom: 1.5px solid #C9B889; font-family: Karla; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: #9A8A6E; font-weight: 500;\">Page<\u002Fsc-raw-th>\n                      <\u002Fsc-raw-tr>\n                    <\u002Fsc-raw-thead>\n -appropriation tranches under Bangsamoro Autonomy Act No. 63, all issued on 22 or 23 October 2024 — the release-side date for the FY2024 column of the Special Fund loop. A different fund type from the block grant SAROs above; never merged with them.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"display: flex; gap: 10px; align-items: center;\">\n              <x-import component-from-global-scope=\"MindanaoDesignSystem_94fd56.Badge\" tone=\"success\" hint-size=\"auto,22px\">Measured<\u002Fx-import>\n              <x-import component-from-global-scope=\"MindanaoDesignSystem_94fd56.Button\" variant=\"secondary\" size=\"sm\" sc-camel-on-click=\"{{ dl.sf }}\" hint-size=\"auto,34px\">CSV<\u002Fx-import>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: #E4D8BF; border: 1px solid #E4D8BF; border-radius: 8px; overflow: hidden; margin: 18px 0 0;\">\n            <sc-for list=\"{{ sfKpis }}\" as=\"k\" hint-placeholder-count=\"4\">\n              <div style=\"background: #F7F1E4; padding: 13px 15px;\">\n                <div style=\"font-family: 'Karla'; font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: #9A8A6E; font-weight: 500;\">{{ k.label }}<\u002Fdiv>\n                <div style=\"font-family: 'Marcellus', Georgia, serif; font-size: 20px; color: #2E2418; margin-top: 5px; font-variant-numeric: tabular-nums;\">{{ k.value }}<\u002Fdiv>\n                <div style=\"font-size: 11.5px; color: #6E6047; margin-top: 2px;\">{{ k.sub }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <sc-if value=\"{{ showDetail }}\" hint-placeholder-val=\"{{ true }}\">\n            <details style=\"margin-top: 14px;\">\n              <summary style=\"cursor: pointer; font-family: 'Karla'; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #A85C32; font-weight: 500; padding: 8px 0;\">All sixteen SAROs, notes &amp; sources ▾<\u002Fsummary>\n              <div style=\"font-size: 13.5px; line-height: 1.7; color: #6E6047; max-width: 78ch;\">\n                <p style=\"margin: 0 0 10px;\"><strong style=\"color: #2E2418;\">No tranche total is computed, and none should be.<\u002Fstrong> The source verification that found these rows deliberately avoided summing them; MOOE and CO figures are shown per row only. One further row is excluded: SARO-MHSD-24-0000872 (22 Oct 2024, ₱112,800,000.00 CO), whose Particular field reads \"BAA 6\" not \"BAA 63\" — a source typo, stated here rather than silently corrected.<\u002Fp>\n                <div style=\"overflow-x: auto; margin-bottom: 10px;\">\n                  <sc-raw-table style=\"width: 100%; min-width: 640px; border-collapse: collapse; font-size: 12.5px;\">\n                    <sc-raw-thead>\n                      <sc-raw-tr>\n                        <sc-raw-th style=\"text-align: left; padding: 7px 8px; border-bottom: 1.5px solid #C9B889; font-family: Karla; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: #9A8A6E; font-weight: 500;\">Office<\u002Fsc-raw-th>\n                        <sc-raw-th style=\"text-align: left; padding: 7px 8px; border-bottom: 1.5px solid #C9B889; font-family: Karla; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: #9A8A6E; font-weight: 500;\">SARO number<\u002Fsc-raw-th>\n                        <sc-raw-th style=\"text-align: left; padding: 7px 8px; border-bottom: 1.5px solid #C9B889; font-family: Karla; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: #9A8A6E; font-weight: 500;\">Date<\u002Fsc-raw-th>\n                        <sc-raw-th style=\"text-align: right; padding: 7px 8px; border-bottom: 1.5px solid #C9B889; font-family: Karla; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: #9A8A6E; font-weight: 500;\">MOOE<\u002Fsc-raw-th>\n                        <sc-raw-th style=\"text-align: right; padding: 7px 8px; border-bottom: 1.5px solid #C9B889; font-family: Karla; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: #9A8A6E; font-weight: 500;\">CO<\u002Fsc-raw-th>\n                        <sc-raw-th style=\"text-align: left; padding: 7px 8px; border-bottom: 1.5px solid #C9B889; font-family: Karla; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: #9A8A6E; font-weight: 500;\">Page<\u002Fsc-raw-th>\n                      <\u002Fsc-raw-tr>\n                    <\u002Fsc-raw-thead>\n                    <sc-raw-tbody>\n                      <sc-for list=\"{{ sfRows }}\" as=\"r\" hint-placeholder-count=\"16\">\n                        <sc-raw-tr>\n                          <sc-raw-td style=\"padding: 6px 8px; border-bottom: 1px solid #E4D8BF;\">{{ r.office }}<\u002Fsc-raw-td>\n                          <sc-raw-td style=\"padding: 6px 8px; border-bottom: 1px solid #E4D8BF; font-size: 11.5px;\">{{ r.num }}<\u002Fsc-raw-td>\n                          <sc-raw-td style=\"padding: 6px 8px; border-bottom: 1px solid #E4D8BF;\">{{ r.date }}<\u002Fsc-raw-td>\n                          <sc-raw-td style=\"padding: 6px 8px; border-bottom: 1px solid #E4D8BF; text-align: right; font-variant-numeric: tabular-nums;\">{{ r.mooe }}<\u002Fsc-raw-td>\n                          <sc-raw-td style=\"padding: 6px 8px; border-bottom: 1px solid #E4D8BF; text-align: right; font-variant-numeric: tabular-nums;\">{{ r.co }}<\u002Fsc-raw-td>\n                          <sc-raw-td style=\"padding: 6px 8px; border-bottom: 1px solid #E4D8BF;\">{{ r.page }}<\u002Fsc-raw-td>\n                        <\u002Fsc-raw-tr>\n                      <\u002Fsc-for>\n                    <\u002Fsc-raw-tbody>\n                  <\u002Fsc-raw-table>\n                <\u002Fdiv>\n                <p style=\"margin: 0;\">Source: MFBM <em>Special Allotment Release Order FY 2024<\u002Fem>, native searchable 48-page PDF, rows on pp. 37–39, cross-checked against rendered pages. Data: <code>barmm_saro_special_fund.csv<\u002Fcode>.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdetails>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div id=\"execution\" style=\"padding-top: 56px;\">\n        <div style=\"display: flex; align-items: baseline; gap: 16px; padding-bottom: 6px; border-bottom: 1px solid #D9CDB6;\">\n          <span style=\"font-family: 'Marcellus', Georgia, serif; font-size: 15px; color: #9A8A6E;\">02<\u002Fspan>\n          <h2 style=\"font-family: 'Marcellus', Georgia, serif; font-size: 30px; color: #2E2418; margin: 0; font-weight: 400;\">Execution<\u002Fh2>\n          <span style=\"font-size: 13.5px; color: #6E6047; margin-left: auto;\">Which ministries turn obligations into cash<\u002Fspan>\n        <\u002Fdiv>\n\n        <div data-panel=\"1\" data-screen-label=\"V4 heatmap\" style=\"background: #FBF6EA; border: 1px solid #E4D8BF; border-radius: 10px; padding: 28px 30px; margin-top: 24px; box-shadow: 0 1px 3px rgba(46,36,24,.05);\">\n          <div style=\"display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; flex-wrap: wrap;\">\n            <div style=\"max-width: 60ch;\">\n              <h3 style=\"font-family: 'Marcellus', Georgia, serif; font-size: 21px; color: #2E2418; margin: 0; font-weight: 400;\">Disbursement execution by ministry<\u002Fh3>\n              <p style=\"font-size: 13.5px; line-height: 1.6; color: #6E6047; margin: 6px 0 0;\">Cash disbursed ÷ amount obligated, per ministry per year, worst six-year average first. Click a row to isolate it.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"display: flex; gap: 10px; align-items: center;\">\n              <x-import component-from-global-scope=\"MindanaoDesignSystem_94fd56.Badge\" tone=\"success\" hint-size=\"auto,22px\">Measured ratio<\u002Fx-import>\n              <x-import component-from-global-scope=\"MindanaoDesignSystem_94fd56.Button\" variant=\"secondary\" size=\"sm\" sc-camel-on-click=\"{{ dl.v4 }}\" hint-size=\"auto,34px\">CSV<\u002Fx-import>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin: 18px 0 10px;\">\n            <div style=\"display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: #6E6047;\">\n              <span>40%<\u002Fspan>\n              <span style=\"width: 150px; height: 10px; border-radius: 2px; background: linear-gradient(to right, #A85C32, #C98A3B, #4A5D3A); display: inline-block;\"><\u002Fspan>\n              <span>100%+<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: #6E6047;\">\n              <span style=\"width: 11px; height: 11px; background: #F7F1E4; border: 1px dashed #C9B889; display: inline-block;\"><\u002Fspan>Agency not yet established\n            <\u002Fdiv>\n            <div style=\"display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: #6E6047;\">\n              <span style=\"color: #C98A3B;\">◤<\u002Fspan>Reported as of 30 Sep\n              <span style=\"color: #A85C32; margin-left: 8px;\">◤<\u002Fspan>30 Jun or prior year\n            <\u002Fdiv>\n            <sc-if value=\"{{ selName }}\" hint-placeholder-val=\"{{ false }}\">\n              <button sc-camel-on-click=\"{{ clearSel }}\" style=\"font-family: Karla; font-size: 12.5px; color: #A85C32; background: none; border: 1px solid #C9B889; border-radius: 999px; padding: 5px 14px; cursor: pointer; margin-left: auto;\" style-hover=\"background: #F0E6CF;\">Clear {{ selName }} ✕<\u002Fbutton>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <div style=\"overflow-x: auto;\">\n          <svg sc-camel-view-box=\"{{ v4VB }}\" style=\"width: 100%; min-width: 620px; height: auto; display: block; overflow: visible;\">\n            {{ v4El }}\n          <\u002Fsvg>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ selName }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size: 13.5px; line-height: 1.6; color: #3A2E1E; background: #F0E6CF; border-radius: 6px; padding: 12px 14px; margin-top: 14px;\">{{ selDetail }}<\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ showDetail }}\" hint-placeholder-val=\"{{ true }}\">\n            <details style=\"margin-top: 12px;\">\n              <summary style=\"cursor: pointer; font-family: 'Karla'; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #A85C32; font-weight: 500; padding: 8px 0;\">What this ratio is, and is not ▾<\u002Fsummary>\n              <div style=\"font-size: 13.5px; line-height: 1.7; color: #6E6047; max-width: 78ch;\">\n                <p style=\"margin: 0 0 10px;\"><code>barmm_flows.csv<\u002Fcode> has no per-ministry allocation or release figure — only totals obligated and disbursed. So this is <strong>disbursement execution<\u002Fstrong> (cash paid out against what was committed), not a release-to-spend utilisation rate. Numerator is disbursement, denominator obligation, by definition; no amounts are pooled across bases.<\u002Fp>\n                <p style=\"margin: 0;\">Corner triangles expose the source's own pp. 7–8 reporting cutoffs. Source caveat: FY2024 ministry disbursements total the printed p. 7 grand total ₱57,647,221,937.27 but exceed p. 7's aggregate instrument subtotal by ₱1,839,967.75; the contradiction is retained at low confidence rather than silently forced to reconcile.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdetails>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div id=\"loop\" style=\"padding-top: 56px;\">\n        <div style=\"display: flex; align-items: baseline; gap: 16px; padding-bottom: 6px; border-bottom: 1px solid #D9CDB6;\">\n          <span style=\"font-family: 'Marcellus', Georgia, serif; font-size: 15px; color: #9A8A6E;\">03<\u002Fspan>\n          <h2 style=\"font-family: 'Marcellus', Georgia, serif; font-size: 30px; color: #2E2418; margin: 0; font-weight: 400;\">The Special Fund loop<\u002Fh2>\n          <span style=\"font-size: 13.5px; color: #6E6047; margin-left: auto;\">The one circularity lever that is measured, not modelled<\u002Fspan>\n        <\u002Fdiv>\n\n        <div data-panel=\"1\" data-screen-label=\"C4 re-appropriation\" style=\"background: #FBF6EA; border: 1px solid #E4D8BF; border-left: 3px solid #4A5D3A; border-radius: 10px; padding: 28px 30px; margin-top: 24px; box-shadow: 0 1px 3px rgba(46,36,24,.05);\">\n          <div style=\"display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; flex-wrap: wrap;\">\n            <div style=\"max-width: 66ch;\">\n              <h3 style=\"font-family: 'Marcellus', Georgia, serif; font-size: 21px; color: #2E2418; margin: 0; font-weight: 400;\">Reversion and re-appropriation, cohort by cohort<\u002Fh3>\n              <p style=\"font-size: 15px; line-height: 1.7; color: #6E6047; margin: 10px 0 0; font-weight: 300;\">Under RA 11054 Article XII §19, any unspent block grant reverts to the Bangsamoro Treasury under a Special Fund for re-appropriation. Reversion is automatic; re-appropriation is not. That makes the Special Fund a queue — and a queue can be measured.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"display: flex; gap: 10px; align-items: center;\">\n              <x-import component-from-global-scope=\"MindanaoDesignSystem_94fd56.Badge\" tone=\"success\" hint-size=\"auto,22px\">Measured<\u002Fx-import>\n              <x-import component-from-global-scope=\"MindanaoDesignSystem_94fd56.Button\" variant=\"secondary\" size=\"sm\" sc-camel-on-click=\"{{ dl.c4 }}\" hint-size=\"auto,34px\">CSV<\u002Fx-import>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 1px; background: #E4D8BF; border: 1px solid #E4D8BF; border-radius: 8px; overflow: hidden; margin: 20px 0 22px;\">\n            <sc-for list=\"{{ c4Kpis }}\" as=\"k\" hint-placeholder-count=\"5\">\n              <div style=\"background: #F7F1E4; padding: 14px 16px;\">\n                <div style=\"font-family: 'Karla'; font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: #9A8A6E; font-weight: 500;\">{{ k.label }}<\u002Fdiv>\n                <div style=\"font-family: 'Marcellus', Georgia, serif; font-size: 21px; color: #2E2418; margin-top: 6px; font-variant-numeric: tabular-nums;\">{{ k.value }}<\u002Fdiv>\n                <div style=\"font-size: 11.5px; color: #6E6047; margin-top: 2px; line-height: 1.4;\">{{ k.sub }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 28px;\">\n            <div>\n              <div style=\"font-family: 'Karla'; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #9A8A6E; font-weight: 500;\">Where each reverted cohort went<\u002Fdiv>\n              <p style=\"font-size: 13px; line-height: 1.55; color: #6E6047; margin: 6px 0 10px;\">Bar width is the peso amount reverted from that block grant year. Segments are the fiscal year it came back out, taken from the source's own vintage sub-rows.<\u002Fp>\n              <svg sc-camel-view-box=\"{{ c4VB }}\" style=\"width: 100%; height: auto; display: block; overflow: visible;\">\n                {{ c4CohortEl }}\n              <\u002Fsvg>\n              <div style=\"display: flex; gap: 14px; flex-wrap: wrap; margin-top: 8px;\">\n                <sc-for list=\"{{ c4Legend }}\" as=\"g\" hint-placeholder-count=\"4\">\n                  <div style=\"display: flex; gap: 6px; align-items: center; font-size: 12px; color: #6E6047;\">\n                    <span style=\"{{ g.style }}\"><\u002Fspan>\n                    <span>{{ g.label }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"font-size: 12.5px; color: #3C4C2F; font-weight: 500; margin-top: 8px;\">{{ c4Check }}<\u002Fdiv>\n            <\u002Fdiv>\n\n            <div>\n              <div style=\"font-family: 'Karla'; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #9A8A6E; font-weight: 500;\">Reversion rate by fiscal year<\u002Fdiv>\n              <p style=\"font-size: 13px; line-height: 1.55; color: #6E6047; margin: 6px 0 10px;\">Full bar is the unobligated balance; solid is what reverted to the Special Fund; hatched is unobligated but <em>not<\u002Fem> reverted.<\u002Fp>\n              <svg sc-camel-view-box=\"{{ c4RateVB }}\" style=\"width: 100%; height: auto; display: block; overflow: visible;\">\n                {{ c4RateEl }}\n              <\u002Fsvg>\n              <div style=\"font-size: 12px; color: #9A8A6E; line-height: 1.5; margin-top: 6px;\">The reversion line is absent from the source table for FY2023–25 — Bangsamoro Autonomy Acts 38 and 52 extended appropriation validity. \"Provisional\" means the column is not fully as of 31 Dec 2025.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"font-size: 14px; line-height: 1.7; color: #3A2E1E; background: #F0E6CF; border-left: 3px solid #A85C32; border-radius: 6px; padding: 14px 16px; margin-top: 20px; max-width: 88ch;\">\n            <strong>The loop does not close, and this panel does not claim it does.<\u002Fstrong> ₱30,299,345,504.38 reverted; ₱30,289,943,558.24 came back out. The ₱9.4M difference is not rounding, not a transcription error and not a scope difference — the source's own vintage sub-rows split it into two cohort residuals (FY2020 ₱7,100,000.00 exactly; FY2021 ₱2,301,946.14) while FY2022 closes to the centavo. What the source does not say is why. So the claim made here is the defensible one: <strong>99.969% of reverted funds are traced to a named re-appropriation year, and ₱9.4M is not.<\u002Fstrong>\n          <\u002Fdiv>\n\n          <div style=\"font-size: 14px; line-height: 1.7; color: #3A2E1E; background: #F0E6CF; border-left: 3px solid #4A5D3A; border-radius: 6px; padding: 14px 16px; margin-top: 12px; max-width: 88ch;\">\n            <strong>The bigger finding: the reversion mechanism has been legislated away.<\u002Fstrong> Reversion covered 100% of the unobligated balance in FY2020 and FY2021, 45.9% in FY2022, and 0% in FY2023–25 — for those years the reversion line is absent from the table structure entirely, not reported as zero. Bangsamoro Autonomy Act No. 38 keeps FY2020–22 appropriations effective until fully utilised, and No. 52 extends the FY2023 GAA's validity. Extending appropriation validity suspends the §19 lapse that triggers reversion. Whether that helps or hurts circularity is a genuine open question: extended validity keeps money with the implementing ministry and skips the two-to-three-year queue, but removes Parliament's re-allocation checkpoint. Both readings fit the data.\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ showDetail }}\" hint-placeholder-val=\"{{ true }}\">\n            <details style=\"margin-top: 14px;\">\n              <summary style=\"cursor: pointer; font-family: 'Karla'; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #A85C32; font-weight: 500; padding: 8px 0;\">Vintage matrix, every cell with its source page ▾<\u002Fsummary>\n              <div style=\"overflow-x: auto; margin-top: 6px;\">\n                <sc-raw-table style=\"width: 100%; min-width: 720px; border-collapse: collapse; font-size: 12px;\">\n                  <sc-raw-thead>\n                    <sc-raw-tr>\n                      <sc-raw-th style=\"text-align: left; padding: 7px 8px; border-bottom: 1.5px solid #C9B889; font-family: Karla; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: #9A8A6E; font-weight: 500;\">Vintage FY<\u002Fsc-raw-th>\n                      <sc-raw-th style=\"text-align: right; padding: 7px 8px; border-bottom: 1.5px solid #C9B889; font-family: Karla; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: #9A8A6E; font-weight: 500;\">Reverted (p.1)<\u002Fsc-raw-th>\n                      <sc-raw-th style=\"text-align: right; padding: 7px 8px; border-bottom: 1.5px solid #C9B889; font-family: Karla; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: #9A8A6E; font-weight: 500;\">Re-app. FY2022<\u002Fsc-raw-th>\n                      <sc-raw-th style=\"text-align: right; padding: 7px 8px; border-bottom: 1.5px solid #C9B889; font-family: Karla; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: #9A8A6E; font-weight: 500;\">Re-app. FY2023<\u002Fsc-raw-th>\n                      <sc-raw-th style=\"text-align: right; padding: 7px 8px; border-bottom: 1.5px solid #C9B889; font-family: Karla; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: #9A8A6E; font-weight: 500;\">Re-app. FY2024<\u002Fsc-raw-th>\n                      <sc-raw-th style=\"text-align: right; padding: 7px 8px; border-bottom: 1.5px solid #C9B889; font-family: Karla; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: #9A8A6E; font-weight: 500;\">Total re-app.<\u002Fsc-raw-th>\n                      <sc-raw-th style=\"text-align: right; padding: 7px 8px; border-bottom: 1.5px solid #C9B889; font-family: Karla; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: #9A8A6E; font-weight: 500;\">Residual (derived)<\u002Fsc-raw-th>\n                    <\u002Fsc-raw-tr>\n                  <\u002Fsc-raw-thead>\n                  <sc-raw-tbody>\n                    <sc-for list=\"{{ c4Rows }}\" as=\"r\" hint-placeholder-count=\"3\">\n                      <sc-raw-tr>\n                        <sc-raw-td style=\"padding: 6px 8px; border-bottom: 1px solid #E4D8BF;\">{{ r.vintage }}<\u002Fsc-raw-td>\n                        <sc-raw-td style=\"padding: 6px 8px; border-bottom: 1px solid #E4D8BF; text-align: right; font-variant-numeric: tabular-nums;\">{{ r.reverted }}<\u002Fsc-raw-td>\n                        <sc-raw-td style=\"padding: 6px 8px; border-bottom: 1px solid #E4D8BF; text-align: right; font-variant-numeric: tabular-nums;\">{{ r.y2022 }}<\u002Fsc-raw-td>\n                        <sc-raw-td style=\"padding: 6px 8px; border-bottom: 1px solid #E4D8BF; text-align: right; font-variant-numeric: tabular-nums;\">{{ r.y2023 }}<\u002Fsc-raw-td>\n                        <sc-raw-td style=\"padding: 6px 8px; border-bottom: 1px solid #E4D8BF; text-align: right; font-variant-numeric: tabular-nums;\">{{ r.y2024 }}<\u002Fsc-raw-td>\n                        <sc-raw-td style=\"padding: 6px 8px; border-bottom: 1px solid #E4D8BF; text-align: right; font-variant-numeric: tabular-nums;\">{{ r.total }}<\u002Fsc-raw-td>\n                        <sc-raw-td style=\"padding: 6px 8px; border-bottom: 1px solid #E4D8BF; text-align: right; font-variant-numeric: tabular-nums; color: #A85C32; font-weight: 500;\">{{ r.residual }}<\u002Fsc-raw-td>\n                      <\u002Fsc-raw-tr>\n                    <\u002Fsc-for>\n                    <sc-raw-tr>\n                      <sc-raw-td style=\"padding: 7px 8px; border-top: 1.5px solid #C9B889; font-weight: 700;\">Total<\u002Fsc-raw-td>\n                      <sc-raw-td style=\"padding: 7px 8px; border-top: 1.5px solid #C9B889; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums;\">{{ c4Total.reverted }}<\u002Fsc-raw-td>\n                      <sc-raw-td style=\"padding: 7px 8px; border-top: 1.5px solid #C9B889; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums;\">{{ c4Total.y2022 }}<\u002Fsc-raw-td>\n                      <sc-raw-td style=\"padding: 7px 8px; border-top: 1.5px solid #C9B889; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums;\">{{ c4Total.y2023 }}<\u002Fsc-raw-td>\n                      <sc-raw-td style=\"padding: 7px 8px; border-top: 1.5px solid #C9B889; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums;\">{{ c4Total.y2024 }}<\u002Fsc-raw-td>\n                      <sc-raw-td style=\"padding: 7px 8px; border-top: 1.5px solid #C9B889; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums;\">{{ c4Total.total }}<\u002Fsc-raw-td>\n                      <sc-raw-td style=\"padding: 7px 8px; border-top: 1.5px solid #C9B889; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; color: #A85C32;\">{{ c4Total.residual }}<\u002Fsc-raw-td>\n                    <\u002Fsc-raw-tr>\n                    <sc-raw-tr>\n                      <sc-raw-td style=\"padding: 6px 8px; color: #9A8A6E;\">Published column total (p.1)<\u002Fsc-raw-td>\n                      <sc-raw-td><\u002Fsc-raw-td>\n                      <sc-raw-td style=\"padding: 6px 8px; text-align: right; color: #9A8A6E; font-variant-numeric: tabular-nums;\">{{ c4Published.y2022 }}<\u002Fsc-raw-td>\n                      <sc-raw-td style=\"padding: 6px 8px; text-align: right; color: #9A8A6E; font-variant-numeric: tabular-nums;\">{{ c4Published.y2023 }}<\u002Fsc-raw-td>\n                      <sc-raw-td style=\"padding: 6px 8px; text-align: right; color: #9A8A6E; font-variant-numeric: tabular-nums;\">{{ c4Published.y2024 }}<\u002Fsc-raw-td>\n                      <sc-raw-td colspan=\"2\" style=\"padding: 6px 8px; color: #3C4C2F; font-size: 12px;\">{{ c4Check }}<\u002Fsc-raw-td>\n                    <\u002Fsc-raw-tr>\n                  <\u002Fsc-raw-tbody>\n                <\u002Fsc-raw-table>\n              <\u002Fdiv>\n              <div style=\"font-size: 13.5px; line-height: 1.7; color: #6E6047; max-width: 84ch; margin-top: 12px;\">\n                <p style=\"margin: 0 0 10px;\"><strong style=\"color: #2E2418;\">Velocity is measured to annual resolution only, and the panel stops there.<\u002Fstrong> The matrix gives a real measured lag — 2.67 fiscal years weighted mean, with 65.9% of re-appropriated money returning at exactly a three-year lag and none faster than two. That floor is structural: a year must close before its underspend is known, and re-appropriating it needs a parliamentary appropriation. Two things are not measurable and have not been modelled to fill the gap. <strong>Re-appropriation is not re-obligation<\u002Fstrong> — once re-appropriated, money is pooled into the year's fund sources and no published figure separates it from that year's own SARO releases. <strong>Sub-annual timing needs Special Fund SARO dates<\u002Fstrong>; sixteen were found for FY2024 (see the panel above), which narrows the gap without closing it. With three completed cohorts and five observed cells, fitting a lag distribution would have more parameters than data.<\u002Fp>\n                <p style=\"margin: 0;\">All cells: block grant utilization summary p. 1, rows \"Add: Supplemental Funding Derived from Re-appropriation\" (vintage sub-rows) and \"Less: Re-appropriated Unexpended Budget\". Confirming reads: FY2022 column p. 5, FY2023 p. 6, FY2024 p. 7. The residual column is derived arithmetic, not a published cell. Legal text: RA 11054 Art. XII §19, pp. 63–64. Cell-level data: <code>barmm_c4_reappropriation.csv<\u002Fcode>.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdetails>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div id=\"circularity\" style=\"padding-top: 56px;\">\n        <div style=\"display: flex; align-items: baseline; gap: 16px; padding-bottom: 6px; border-bottom: 1px solid #D9CDB6;\">\n          <span style=\"font-family: 'Marcellus', Georgia, serif; font-size: 15px; color: #9A8A6E;\">04<\u002Fspan>\n          <h2 style=\"font-family: 'Marcellus', Georgia, serif; font-size: 30px; color: #2E2418; margin: 0; font-weight: 400;\">Circularity &amp; leakage<\u002Fh2>\n          <span style=\"font-size: 13.5px; color: #6E6047; margin-left: auto;\">Does a peso spent here stay here?<\u002Fspan>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; gap: 12px; align-items: flex-start; background: #F0E6CF; border-radius: 8px; padding: 14px 16px; margin-top: 20px; max-width: 92ch;\">\n          <svg sc-camel-view-box=\"0 0 14 14\" style=\"width: 14px; height: 14px; margin-top: 3px; flex: 0 0 14px;\">\n            <rect x=\"0.5\" y=\"0.5\" width=\"13\" height=\"13\" fill=\"url(#hOchre)\" stroke=\"#C98A3B\"><\u002Frect>\n          <\u002Fsvg>\n          <div style=\"font-size: 13.5px; line-height: 1.65; color: #3A2E1E;\"><strong>How to read this section.<\u002Fstrong> Solid fills are measured figures. <strong>Hatched fills are modelled<\u002Fstrong> — a scenario, not a measurement. Everything downstream of the principal in the leakage model below is hatched for that reason.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div data-panel=\"1\" data-screen-label=\"V9 leakage\" style=\"background: #FBF6EA; border: 1px solid #E4D8BF; border-left: 3px solid #C98A3B; border-radius: 10px; padding: 28px 30px; margin-top: 18px; box-shadow: 0 1px 3px rgba(46,36,24,.05);\">\n          <div style=\"display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; flex-wrap: wrap;\">\n            <div style=\"max-width: 66ch;\">\n              <h3 style=\"font-family: 'Marcellus', Georgia, serif; font-size: 21px; color: #2E2418; margin: 0; font-weight: 400;\">The leakage model<\u002Fh3>\n              <p style=\"font-size: 15px; line-height: 1.7; color: #6E6047; margin: 10px 0 0; font-weight: 300;\">Government spending is around 36% of the BARMM economy. With 91 unbanked municipalities and thin local intermediation, a peso spent may leave the region within one transaction cycle rather than turning over locally. This traces one year's capital outlay through three rounds — the contract, then wages and subcontracts, then household spend — splitting retained from leaked at each.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"display: flex; gap: 10px; align-items: center;\">\n              <x-import component-from-global-scope=\"MindanaoDesignSystem_94fd56.Badge\" tone=\"warning\" hint-size=\"auto,22px\">Modelled · scenario<\u002Fx-import>\n              <x-import component-from-global-scope=\"MindanaoDesignSystem_94fd56.Button\" variant=\"secondary\" size=\"sm\" sc-camel-on-click=\"{{ dl.v9 }}\" hint-size=\"auto,34px\">CSV<\u002Fx-import>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 22px; margin-top: 22px;\">\n            <div>\n              <div style=\"display: flex; justify-content: space-between; align-items: baseline;\">\n                <span style=\"font-family: 'Karla'; font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: #9A8A6E; font-weight: 500;\">Round 1 retention — stands in for C1<\u002Fspan>\n                <span style=\"font-family: 'Marcellus', Georgia, serif; font-size: 19px; color: #2E2418;\">{{ r1Txt }}<\u002Fspan>\n              <\u002Fdiv>\n              <input type=\"range\" min=\"0\" max=\"100\" value=\"{{ r1 }}\" sc-camel-on-input=\"{{ onR1 }}\" style=\"width: 100%; accent-color: #A85C32; margin: 6px 0;\">\n              <div style=\"font-size: 12px; line-height: 1.5; color: #9A8A6E;\">Not measured. C1 is blocked at value level — this is a user-set scenario input, the honest replacement for a number that does not exist yet.<\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div style=\"display: flex; justify-content: space-between; align-items: baseline;\">\n                <span style=\"font-family: 'Karla'; font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: #9A8A6E; font-weight: 500;\">Round 2 retention — C2<\u002Fspan>\n                <span style=\"font-family: 'Marcellus', Georgia, serif; font-size: 19px; color: #2E2418;\">{{ r2Txt }}<\u002Fspan>\n              <\u002Fdiv>\n              <input type=\"range\" min=\"0\" max=\"100\" value=\"{{ r2 }}\" sc-camel-on-input=\"{{ onR2 }}\" style=\"width: 100%; accent-color: #C98A3B; margin: 6px 0;\">\n              <div style=\"font-size: 12px; line-height: 1.5; color: #9A8A6E;\">Sourced <strong>floor<\u002Fstrong>: construction GVA ₱6.7B ÷ construction capital formation ₱15.2B, 2024. True value is 44–55%, so the floor overstates leakage.<\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div style=\"display: flex; justify-content: space-between; align-items: baseline;\">\n                <span style=\"font-family: 'Karla'; font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: #9A8A6E; font-weight: 500;\">Round 3 retention — C5<\u002Fspan>\n                <span style=\"font-family: 'Marcellus', Georgia, serif; font-size: 19px; color: #2E2418;\">{{ r3Txt }}<\u002Fspan>\n              <\u002Fdiv>\n              <input type=\"range\" min=\"0\" max=\"100\" value=\"{{ r3 }}\" sc-camel-on-input=\"{{ onR3 }}\" style=\"width: 100%; accent-color: #5C4632; margin: 6px 0;\">\n              <div style=\"font-size: 12px; line-height: 1.5; color: #9A8A6E;\">Sourced <strong>ceiling<\u002Fstrong>: (GRDP − exports) ÷ domestic absorption = 53.2%, 2024. Gross exports to the rest of the Philippines are unpublished, so this understates leakage.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1px; background: #E4D8BF; border: 1px solid #E4D8BF; border-radius: 8px; overflow: hidden; margin: 22px 0 6px;\">\n            <sc-for list=\"{{ v9Kpis }}\" as=\"k\" hint-placeholder-count=\"4\">\n              <div style=\"background: #F7F1E4; padding: 14px 16px;\">\n                <div style=\"font-family: 'Karla'; font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: #9A8A6E; font-weight: 500;\">{{ k.label }}<\u002Fdiv>\n                <div style=\"font-family: 'Marcellus', Georgia, serif; font-size: 21px; color: #2E2418; margin-top: 6px; font-variant-numeric: tabular-nums;\">{{ k.value }}<\u002Fdiv>\n                <div style=\"font-size: 11.5px; color: #6E6047; margin-top: 2px;\">{{ k.sub }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"overflow-x: auto;\">\n          <svg sc-camel-view-box=\"{{ v9VB }}\" style=\"width: 100%; min-width: 860px; height: auto; display: block; overflow: visible;\">\n            {{ v9El }}\n          <\u002Fsvg>\n\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ showDetail }}\" hint-placeholder-val=\"{{ true }}\">\n            <details style=\"margin-top: 12px;\">\n              <summary style=\"cursor: pointer; font-family: 'Karla'; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #A85C32; font-weight: 500; padding: 8px 0;\">Where the defaults come from, and what is deliberately absent ▾<\u002Fsummary>\n              <div style=\"font-size: 13.5px; line-height: 1.7; color: #6E6047; max-width: 84ch;\">\n                <p style=\"margin: 0 0 10px;\"><strong style=\"color: #2E2418;\">Why capital outlay as principal.<\u002Fstrong> <code>barmm_flows.csv<\u002Fcode> has no procurement-contract-value field, so CO — the instrument most directly tied to awarded contracts — stands in as the nearest available proxy for \"Round 1 principal\", not the spec's exact percentage-of-contract-value definition of C1.<\u002Fp>\n                <p style=\"margin: 0 0 10px;\">Rounds 2 and 3 are both derived from one published table (Economic Brief No. 2 s.2025, p. 27, PSA actuals at constant 2018 prices), and four accounting identities were checked against it first: supply-side sum equals GRDP; industry subsectors equal industry GVA; consumption plus capital formation plus net exports equals GRDP; exports minus imports equals net exports. All four close within the ±0.1 rounding of one-decimal published figures. Both are labelled medium confidence, never high: C2 divides a supply-side value-added figure by a demand-side expenditure figure, and C5 is a ceiling on all final demand, not household spend alone.<\u002Fp>\n                <p style=\"margin: 0;\"><strong style=\"color: #2E2418;\">C3 (deposit capture and re-lending) has no slider, by design.<\u002Fstrong> It is not a within-round leak rate — it determines whether a fourth round happens at all, which is what the stop-at-three-rounds truncation assumes away. Its personnel-services-per-province half cannot be built: the province column is empty on all 427 rows of <code>barmm_flows.csv<\u002Fcode>. What is sourced instead supports the truncation: 91 of 116 municipalities unbanked, 47 banking offices region-wide, and a region-wide loans-to-deposits ratio of 5.6%.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdetails>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div data-panel=\"1\" data-screen-label=\"V8 financial access\" style=\"background: #FBF6EA; border: 1px solid #E4D8BF; border-left: 3px solid #4A5D3A; border-radius: 10px; padding: 28px 30px; margin-top: 22px; box-shadow: 0 1px 3px rgba(46,36,24,.05);\">\n          <div style=\"display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; flex-wrap: wrap;\">\n            <div style=\"max-width: 66ch;\">\n              <h3 style=\"font-family: 'Marcellus', Georgia, serif; font-size: 21px; color: #2E2418; margin: 0; font-weight: 400;\">Ninety-one of 116 local governments have no bank<\u002Fh3>\n              <p style=\"font-size: 15px; line-height: 1.7; color: #6E6047; margin: 10px 0 0; font-weight: 300;\">The load-bearing claim under the whole circularity thesis, and the one place it is fully measured. Counts of cities and municipalities, not pesos, as of 31 March 2025.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"display: flex; gap: 10px; align-items: center;\">\n              <x-import component-from-global-scope=\"MindanaoDesignSystem_94fd56.Badge\" tone=\"success\" hint-size=\"auto,22px\">Measured<\u002Fx-import>\n              <x-import component-from-global-scope=\"MindanaoDesignSystem_94fd56.Button\" variant=\"secondary\" size=\"sm\" sc-camel-on-click=\"{{ dl.v8 }}\" hint-size=\"auto,34px\">CSV<\u002Fx-import>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1px; background: #E4D8BF; border: 1px solid #E4D8BF; border-radius: 8px; overflow: hidden; margin: 20px 0 22px;\">\n            <sc-for list=\"{{ v8Kpis }}\" as=\"k\" hint-placeholder-count=\"7\">\n              <div style=\"background: #F7F1E4; padding: 14px 16px;\">\n                <div style=\"font-family: 'Karla'; font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: #9A8A6E; font-weight: 500;\">{{ k.label }}<\u002Fdiv>\n                <div style=\"font-family: 'Marcellus', Georgia, serif; font-size: 21px; color: #2E2418; margin-top: 6px; font-variant-numeric: tabular-nums;\">{{ k.value }}<\u002Fdiv>\n                <div style=\"font-size: 11.5px; color: #6E6047; margin-top: 2px; line-height: 1.4;\">{{ k.sub }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 28px;\">\n            <div>\n              <div style=\"font-family: 'Karla'; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #9A8A6E; font-weight: 500;\">Every local government, one square<\u002Fdiv>\n              <p style=\"font-size: 13px; line-height: 1.55; color: #6E6047; margin: 6px 0 10px;\">116 squares for the region's 116 cities and municipalities. 91 are unbanked, coloured by the province the source attributes them to; the 25 with a banking office are left empty, because no province split is published for those.<\u002Fp>\n              <svg sc-camel-view-box=\"{{ v8GridVB }}\" style=\"width: 100%; height: auto; display: block;\">\n                {{ v8GridEl }}\n              <\u002Fsvg>\n              <div style=\"display: flex; gap: 12px; flex-wrap: wrap; margin-top: 10px;\">\n                <sc-for list=\"{{ v8GridLegend }}\" as=\"g\" hint-placeholder-count=\"6\">\n                  <div style=\"display: flex; gap: 6px; align-items: center; font-size: 12px; color: #6E6047;\">\n                    <span style=\"{{ g.style }}\"><\u002Fspan>\n                    <span>{{ g.label }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"font-size: 12px; color: #9A8A6E; line-height: 1.5; margin-top: 8px;\">Squares are <strong>counts, not municipalities<\u002Fstrong>. Position carries no geography and no square identifies a named local government — the source does not name them.<\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-family: 'Karla'; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #9A8A6E; font-weight: 500;\">Unbanked municipalities by province<\u002Fdiv>\n              <p style=\"font-size: 13px; line-height: 1.55; color: #6E6047; margin: 6px 0 10px;\">The five provinces as published, March 2025. Bars are absolute counts.<\u002Fp>\n              <svg sc-camel-view-box=\"{{ v8BarsVB }}\" style=\"width: 100%; height: auto; display: block; overflow: visible;\">\n                {{ v8BarsEl }}\n              <\u002Fsvg>\n              <div style=\"font-size: 12px; color: #9A8A6E; line-height: 1.5; margin-top: 8px;\">Sulu is absent from this series, not zero: the BSP cut is March 2025, after the Supreme Court ruling of 9 September 2024 excluded Sulu from BARMM.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"margin-top: 26px;\">\n            <div style=\"font-family: 'Karla'; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #9A8A6E; font-weight: 500;\">Why \"no bank\" is a circularity finding, not just an access statistic<\u002Fdiv>\n            <p style=\"font-size: 13px; line-height: 1.55; color: #6E6047; margin: 6px 0 10px;\">Where the one Shari'ah-compliant bank's financing actually goes, as a share of portfolio, 2024.<\u002Fp>\n            <svg sc-camel-view-box=\"{{ v8AaiVB }}\" style=\"width: 100%; height: auto; display: block; overflow: visible;\">\n              {{ v8AaiEl }}\n            <\u002Fsvg>\n          <\u002Fdiv>\n\n          <div style=\"font-size: 14px; line-height: 1.7; color: #3A2E1E; background: #F0E6CF; border-left: 3px solid #5C4632; border-radius: 6px; padding: 14px 16px; margin-top: 20px; max-width: 88ch;\">\n            <strong>The chain, each link measured.<\u002Fstrong> 91 of 116 local governments have no banking office, and the region has 47 offices for 116 of them — 0.41 each — so salary and transfer money largely cannot be captured as a deposit. Where deposits are mobilised, re-lending is thin: region-wide, BARMM banks held ₱150.208B in deposits against ₱8.431B in loans, a ratio of 5.6%. AAIIBP, the country's only Islamic bank, re-lends 25.6% of its deposits and puts 88.11% of that portfolio into household activities and retail trade against 1.07% in construction. These figures show limited access and a concentrated portfolio; they are contextual evidence for the three-round truncation, not proof of a causal consumption pathway.\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ showDetail }}\" hint-placeholder-val=\"{{ true }}\">\n            <details style=\"margin-top: 14px;\">\n              <summary style=\"cursor: pointer; font-family: 'Karla'; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #A85C32; font-weight: 500; padding: 8px 0;\">Corrections, denominators, and every figure with its source ▾<\u002Fsummary>\n              <div style=\"font-size: 13.5px; line-height: 1.7; color: #6E6047; max-width: 84ch;\">\n                <p style=\"margin: 0 0 10px;\"><strong style=\"color: #2E2418;\">The spec's own table was transcribed wrongly, and this panel uses the corrected reading.<\u002Fstrong> Spec §3.5 lists Maguindanao del Sur 38 · Lanao del Sur 23 · Basilan 11 · Maguindanao del Norte 10 · Tawi-Tawi 9. The source chart, re-read as native text, gives <strong>Lanao del Sur 38 · Maguindanao del Sur 23 · Basilan 11 · Tawi-Tawi 10 · Maguindanao del Norte 9<\u002Fstrong> — two pairs were swapped. Both readings sum to 91, so no checksum would have caught it. It matters because it inverts which province is the worst case.<\u002Fp>\n                <p style=\"margin: 0 0 10px;\"><strong style=\"color: #2E2418;\">Counts, not rates.<\u002Fstrong> The BSP-compatible denominator is region-wide only (116), which is why 78.4% appears once, for BARMM as a whole, and never per province. The sources disagree even there: the 2nd Bangsamoro Development Plan refers to 119 local governments, and PSA's July 2025 PSGC workbook gives 108 including the Special Geographic Area. A third disagreeing source does not adjudicate between the other two, so the region-wide-only framing stands.<\u002Fp>\n                <p style=\"margin: 0 0 12px;\"><strong style=\"color: #2E2418;\">Confidence on the AAIIBP row is low, on representativeness.<\u002Fstrong> It is one institution with nine branches nationwide, not BARMM-only, operating at a loss and mid-turnaround toward full Islamic-bank status. Its audited ratios are real figures about that bank and are not presented as a BARMM banking-system statistic.<\u002Fp>\n                <div style=\"overflow-x: auto;\">\n                  <sc-raw-table style=\"width: 100%; min-width: 760px; border-collapse: collapse; font-size: 12px;\">\n                    <sc-raw-thead>\n                      <sc-raw-tr>\n                        <sc-raw-th style=\"text-align: left; padding: 7px 8px; border-bottom: 1.5px solid #C9B889; font-family: Karla; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; col
